<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据看板 · 可视化工作台</title>
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --border: #e8ecf1;
    --text: #1f2937;
    --text-2: #6b7280;
    --text-3: #9ca3af;
    --primary: #3b6ef6;
    --primary-soft: #eaf0fe;
    --up: #e5484d;      /* 涨-红 */
    --down: #2e9e5b;    /* 跌-绿 */
    --accent: #7c5cff;
    --accent-soft: #f0ecff;
    --cyan: #14b8c4;
    --amber: #f59e0b;
    --shadow: 0 1px 3px rgba(16,24,40,.06), 0 1px 2px rgba(16,24,40,.04);
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    display: flex;
    min-height: 100vh;
  }

  /* ============ 侧边栏 ============ */
  .sidebar {
    width: 220px;
    background: var(--card);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 20px 18px;
    border-bottom: 1px solid var(--border);
  }
  .logo-icon {
    width: 36px; height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #3b6ef6, #7c5cff);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 16px;
  }
  .logo-text b { display: block; font-size: 15px; }
  .logo-text span { font-size: 12px; color: var(--text-3); }
  .nav { padding: 14px 10px; flex: 1; }
  .nav-title {
    font-size: 11px; color: var(--text-3);
    padding: 10px 10px 6px;
    letter-spacing: 1px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border-radius: 9px;
    color: var(--text-2);
    cursor: pointer;
    margin-bottom: 2px;
    transition: all .15s;
    font-size: 13.5px;
  }
  .nav-item:hover { background: var(--bg); color: var(--text); }
  .nav-item.active {
    background: var(--primary-soft);
    color: var(--primary);
    font-weight: 600;
  }
  .nav-item .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--border);
    margin-left: auto;
  }
  .nav-item.active .dot { background: var(--primary); }
  .sidebar-foot {
    padding: 14px 16px;
    border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text-3);
    display: flex; align-items: center; gap: 8px;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--down);
    box-shadow: 0 0 0 3px rgba(46,158,91,.15);
  }

  /* ============ 主区域 ============ */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 16px 28px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header h1 { font-size: 18px; font-weight: 700; }
  .header .sub { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .date-chip {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 7px 14px;
    border-radius: 20px;
    font-size: 12.5px;
    color: var(--text-2);
  }
  .btn {
    border: 1px solid var(--border);
    background: var(--card);
    padding: 7px 16px;
    border-radius: 9px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text-2);
    transition: all .15s;
  }
  .btn:hover { border-color: var(--primary); color: var(--primary); }
  .btn.primary {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    font-weight: 500;
  }
  .btn.primary:hover { background: #2f5ce0; }
  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f59e0b, #e5484d);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
  }

  /* ============ 内容区 ============ */
  .content { padding: 24px 28px; max-width: 1440px; width: 100%; margin: 0 auto; }

  /* KPI 卡片 */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }
  .kpi-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    box-shadow: var(--shadow);
    transition: transform .15s, box-shadow .15s;
  }
  .kpi-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(16,24,40,.08);
  }
  .kpi-label { font-size: 12.5px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
  .kpi-icon {
    width: 26px; height: 26px; border-radius: 8px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .kpi-value {
    font-size: 28px; font-weight: 700;
    margin: 10px 0 6px;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.5px;
  }
  .kpi-value small { font-size: 14px; font-weight: 500; color: var(--text-3); margin-left: 2px; }
  .kpi-trend { font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .trend-badge {
    padding: 2px 8px;
    border-radius: 6px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .trend-badge.up { color: var(--up); background: rgba(229,72,77,.09); }
  .trend-badge.down { color: var(--down); background: rgba(46,158,91,.09); }
  .kpi-trend .vs { color: var(--text-3); }

  /* 图表面板 */
  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px 22px;
  }
  .panel-head {
    display: flex;
    align-items: center;
    margin-bottom: 16px;
  }
  .panel-head h3 { font-size: 15px; font-weight: 600; }
  .panel-head .desc { font-size: 12px; color: var(--text-3); margin-left: 10px; }
  .panel-head .tools { margin-left: auto; display: flex; gap: 6px; }
  .seg {
    display: flex;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .seg button {
    border: none; background: transparent;
    padding: 5px 12px; font-size: 12px;
    color: var(--text-2); cursor: pointer;
  }
  .seg button.on { background: var(--card); color: var(--primary); font-weight: 600; box-shadow: var(--shadow); }

  .grid-2 {
    display: grid;
    grid-template-columns: 1.9fr 1fr;
    gap: 16px;
    margin-bottom: 20px;
  }
  .grid-2b {
    display: grid;
    grid-template-columns: 1fr 1.9fr;
    gap: 16px;
  }

  /* 折线图 */
  .chart-wrap { position: relative; }
  .tooltip {
    position: absolute;
    pointer-events: none;
    background: #1f2937;
    color: #fff;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    box-shadow: 0 4px 12px rgba(0,0,0,.18);
    opacity: 0;
    transition: opacity .12s;
    z-index: 5;
    white-space: nowrap;
  }
  .tooltip .tt-title { font-weight: 600; margin-bottom: 4px; }
  .tooltip .tt-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  .tooltip .sw { width: 8px; height: 8px; border-radius: 2px; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-2); margin-bottom: 10px; }
  .legend .item { display: flex; align-items: center; gap: 6px; }
  .legend .sw { width: 10px; height: 10px; border-radius: 3px; }

  /* 环形图 */
  .donut-box { display: flex; flex-direction: column; align-items: center; }
  .donut-center {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    pointer-events: none;
  }
  .donut-center b { font-size: 22px; }
  .donut-center span { font-size: 11.5px; color: var(--text-3); }
  .donut-legend { width: 100%; margin-top: 14px; }
  .dl-row {
    display: flex; align-items: center;
    padding: 7px 4px;
    font-size: 12.5px;
    border-bottom: 1px dashed var(--border);
  }
  .dl-row:last-child { border-bottom: none; }
  .dl-row .sw { width: 9px; height: 9px; border-radius: 3px; margin-right: 8px; }
  .dl-row .name { color: var(--text-2); }
  .dl-row .val { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
  .dl-row .pct { color: var(--text-3); margin-left: 10px; width: 44px; text-align: right; font-variant-numeric: tabular-nums; }

  /* 横向条形排行 */
  .rank-row { margin-bottom: 14px; }
  .rank-row:last-child { margin-bottom: 0; }
  .rank-top {
    display: flex; align-items: center;
    font-size: 12.5px; margin-bottom: 6px;
  }
  .rank-num {
    width: 20px; height: 20px;
    border-radius: 6px;
    background: var(--bg);
    color: var(--text-3);
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700;
    margin-right: 8px;
  }
  .rank-row:nth-child(1) .rank-num { background: #fdeaea; color: var(--up); }
  .rank-row:nth-child(2) .rank-num { background: #fef3e2; color: var(--amber); }
  .rank-row:nth-child(3) .rank-num { background: #eaf0fe; color: var(--primary); }
  .rank-top .val { margin-left: auto; font-weight: 600; font-variant-numeric: tabular-nums; }
  .rank-top .delta { margin-left: 8px; font-size: 11px; }
  .delta.up { color: var(--up); }
  .delta.down { color: var(--down); }
  .rank-bar-bg {
    height: 8px; background: var(--bg);
    border-radius: 4px; overflow: hidden;
  }
  .rank-bar {
    height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, #3b6ef6, #7c5cff);
    transition: width .8s cubic-bezier(.22,.8,.32,1);
  }

  /* 数据表格 */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left;
    font-size: 11.5px;
    color: var(--text-3);
    font-weight: 500;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    letter-spacing: .5px;
  }
  tbody td {
    padding: 11px 10px;
    border-bottom: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr { transition: background .12s; }
  tbody tr:hover { background: #f8fafd; }
  .tag {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 11.5px;
    font-weight: 500;
  }
  .tag.ok    { color: var(--down); background: rgba(46,158,91,.1); }
  .tag.warn  { color: var(--amber); background: rgba(245,158,11,.12); }
  .tag.err   { color: var(--up); background: rgba(229,72,77,.1); }
  .tag.info  { color: var(--primary); background: var(--primary-soft); }
  .num-up { color: var(--up); font-weight: 600; }
  .num-down { color: var(--down); font-weight: 600; }

  .foot-note {
    margin-top: 18px;
    font-size: 12px;
    color: var(--text-3);
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    line-height: 1.7;
  }
  .foot-note code {
    background: var(--bg);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 11.5px;
    color: var(--primary);
  }

  /* 响应式 */
  @media (max-width: 1100px) {
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .grid-2, .grid-2b { grid-template-columns: 1fr; }
  }
  @media (max-width: 720px) {
    .sidebar { display: none; }
    .kpi-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ================= 侧边栏 ================= -->
<aside class="sidebar">
  <div class="logo">
    <div class="logo-icon">W</div>
    <div class="logo-text"><b>可视化工作台</b><span>Data Workbench</span></div>
  </div>
  <nav class="nav">
    <div class="nav-title">看板</div>
    <div class="nav-item active">📊 数据总览 <span class="dot"></span></div>
    <div class="nav-item">📈 趋势分析 <span class="dot"></span></div>
    <div class="nav-item">🧭 渠道分析 <span class="dot"></span></div>
    <div class="nav-item">🗺 区域分布 <span class="dot"></span></div>
    <div class="nav-title">管理</div>
    <div class="nav-item">🗂 数据源 <span class="dot"></span></div>
    <div class="nav-item">⚙️ 看板设置 <span class="dot"></span></div>
  </nav>
  <div class="sidebar-foot"><span class="status-dot"></span>数据同步正常 · 示例数据</div>
</aside>

<!-- ================= 主区域 ================= -->
<div class="main">
  <header class="header">
    <div>
      <h1>数据总览</h1>
      <div class="sub" id="headerDate"></div>
    </div>
    <div class="header-right">
      <div class="date-chip" id="rangeChip">近 12 个月</div>
      <button class="btn" onclick="alert('接入真实数据后可用')">导出报表</button>
      <button class="btn primary" onclick="randomizeDemo()">刷新数据</button>
      <div class="avatar">访</div>
    </div>
  </header>

  <main class="content">

    <!-- KPI -->
    <section class="kpi-grid" id="kpiGrid"></section>

    <!-- 趋势 + 渠道占比 -->
    <section class="grid-2">
      <div class="panel">
        <div class="panel-head">
          <h3>核心指标趋势</h3>
          <span class="desc">按月</span>
          <div class="tools">
            <div class="seg" id="trendSeg">
              <button class="on" data-k="revenue">营收</button>
              <button data-k="orders">订单量</button>
            </div>
          </div>
        </div>
        <div class="legend">
          <div class="item"><span class="sw" style="background:#3b6ef6"></span>本期</div>
          <div class="item"><span class="sw" style="background:#c9d6f7"></span>上期</div>
        </div>
        <div class="chart-wrap" id="lineWrap">
          <div class="tooltip" id="lineTip"></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>渠道占比</h3><span class="desc">本月</span></div>
        <div class="donut-box">
          <div class="chart-wrap" style="position:relative;display:flex;justify-content:center;" id="donutWrap"></div>
          <div class="donut-legend" id="donutLegend"></div>
        </div>
      </div>
    </section>

    <!-- 排行 + 明细表 -->
    <section class="grid-2b">
      <div class="panel">
        <div class="panel-head"><h3>区域排行</h3><span class="desc">营收贡献</span></div>
        <div id="rankList"></div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>近期动态明细</h3><span class="desc">最新 8 条</span></div>
        <table>
          <thead>
            <tr>
              <th>事项</th><th>类型</th><th>数值</th><th>环比</th><th>状态</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </section>

    <div class="foot-note">
      💡 当前为<b>示例数据</b>。所有数据集中在脚本顶部 <code>DASHBOARD_DATA</code> 对象中（KPI、月度趋势、渠道、区域、动态明细五个部分），把你的真实数据（Excel / CSV / JSON）发给我即可原样替换，版式与交互不变。
    </div>

  </main>
</div>

<script>
/* ==========================================================
   ★ 数据区 —— 替换真实数据时只改这里 ★
   ========================================================== */
let DASHBOARD_DATA = {
  kpi: [
    { label: "总营收",   icon: "💰", color: "#eaf0fe", value: 1286.4, unit: "万元", trend: +12.8 },
    { label: "订单量",   icon: "🧾", color: "#f0ecff", value: 45230,  unit: "单",   trend: +8.3 },
    { label: "活跃用户", icon: "👥", color: "#e6f7f9", value: 38.6,   unit: "万人", trend: +5.1 },
    { label: "转化率",   icon: "🎯", color: "#fef3e2", value: 4.7,    unit: "%",    trend: -0.6 }
  ],
  months: ["10月","11月","12月","1月","2月","3月","4月","5月","6月","7月","8月","9月"],
  trend: {
    revenue: { cur: [92,88,105,118,96,124,138,130,146,152,148,158],
               pre: [80,76,90,100,84,108,118,115,128,132,130,140] },
    orders:  { cur: [3200,3050,3600,4100,3300,4300,4800,4500,5100,5300,5150,5600],
               pre: [2800,2700,3100,3500,2900,3700,4100,3900,4400,4550,4450,4800] }
  },
  channels: [
    { name: "线上直营", value: 486, color: "#3b6ef6" },
    { name: "电商平台", value: 342, color: "#7c5cff" },
    { name: "线下门店", value: 268, color: "#14b8c4" },
    { name: "渠道分销", value: 190, color: "#f59e0b" }
  ],
  regions: [
    { name: "华东", value: 462, delta: +9.2 },
    { name: "华南", value: 358, delta: +6.8 },
    { name: "华北", value: 286, delta: +3.4 },
    { name: "西南", value: 118, delta: -2.1 },
    { name: "东北", value: 62,  delta: -5.5 }
  ],
  activities: [
    { name: "秋季大促上线",      type: "营销", tag: "info", value: "营收 +186万", mom: "+22%", momUp: true,  status: ["进行中","ok"] },
    { name: "新版 App 发布",     type: "产品", tag: "info", value: "DAU +4.2万", mom: "+11%", momUp: true,  status: ["已完成","ok"] },
    { name: "华南仓扩容",        type: "运营", tag: "warn", value: "成本 +34万", mom: "+8%",  momUp: false, status: ["进行中","warn"] },
    { name: "会员体系改版",      type: "产品", tag: "info", value: "复购 +3.1%", mom: "+15%", momUp: true,  status: ["已上线","ok"] },
    { name: "抖音渠道投放",      type: "营销", tag: "err",  value: "ROI 0.82",   mom: "-12%", momUp: false, status: ["待优化","err"] },
    { name: "客服系统升级",      type: "运营", tag: "info", value: "响应提速40%",mom: "+40%", momUp: true,  status: ["已完成","ok"] },
    { name: "华北配送涨价应对",  type: "运营", tag: "warn", value: "单均 +1.8元",mom: "+6%",  momUp: false, status: ["观察中","warn"] },
    { name: "双11 备货计划",     type: "供应链", tag: "info", value: "备货 12万件",mom: "+18%", momUp: true, status: ["筹备中","info"] }
  ]
};

/* ==========================================================
   渲染逻辑（以下无需改动）
   ========================================================== */
const $ = s => document.querySelector(s);
const fmt = (n, d=0) => n.toLocaleString("zh-CN", { minimumFractionDigits: d, maximumFractionDigits: d });

// 日期
$("#headerDate").textContent = "数据更新于 " + new Date().toLocaleDateString("zh-CN", { year:"numeric", month:"long", day:"numeric" });

/* ---------- KPI ---------- */
function renderKPI() {
  $("#kpiGrid").innerHTML = DASHBOARD_DATA.kpi.map(k => {
    const up = k.trend >= 0;
    return `
      <div class="kpi-card">
        <div class="kpi-label"><span class="kpi-icon" style="background:${k.color}">${k.icon}</span>${k.label}</div>
        <div class="kpi-value">${fmt(k.value, k.value % 1 ? 1 : 0)}<small>${k.unit}</small></div>
        <div class="kpi-trend">
          <span class="trend-badge ${up ? "up" : "down"}">${up ? "▲" : "▼"} ${Math.abs(k.trend)}%</span>
          <span class="vs">较上期</span>
        </div>
      </div>`;
  }).join("");
}

/* ---------- 折线图（原生 SVG） ---------- */
let trendKey = "revenue";
function renderLine() {
  const wrap = $("#lineWrap");
  const old = wrap.querySelector("svg"); if (old) old.remove();
  const d = DASHBOARD_DATA.trend[trendKey];
  const W = Math.max(wrap.clientWidth, 320), H = 260;
  const PL = 46, PR = 14, PT = 12, PB = 28;
  const iw = W - PL - PR, ih = H - PT - PB;
  const all = d.cur.concat(d.pre);
  const max = Math.ceil(Math.max(...all) * 1.15 / 10) * 10;
  const x = i => PL + (iw * i) / (d.cur.length - 1);
  const y = v => PT + ih - (ih * v) / max;

  let g = "";
  for (let i = 0; i <= 4; i++) {
    const vy = PT + (ih * i) / 4;
    g += `<line x1="${PL}" y1="${vy}" x2="${W - PR}" y2="${vy}" stroke="#eef1f5"/>
          <text x="${PL - 8}" y="${vy + 4}" font-size="10" fill="#9ca3af" text-anchor="end">${fmt(max - (max * i) / 4)}</text>`;
  }
  const labels = DASHBOARD_DATA.months;
  labels.forEach((m, i) => {
    if (i % Math.ceil(labels.length / 6) === 0 || i === labels.length - 1)
      g += `<text x="${x(i)}" y="${H - 8}" font-size="10" fill="#9ca3af" text-anchor="middle">${m}</text>`;
  });

  const line = (arr, stroke, fill, op) => {
    const pts = arr.map((v, i) => `${x(i)},${y(v)}`).join(" ");
    const area = `M${x(0)},${y(arr[0])} ` + arr.map((v, i) => `L${x(i)},${y(v)}`).join(" ") + ` L${x(arr.length-1)},${PT+ih} L${x(0)},${PT+ih} Z`;
    return `<path d="${area}" fill="${fill}" opacity="${op}"/>
            <polyline points="${pts}" fill="none" stroke="${stroke}" stroke-width="2.5"
              stroke-linejoin="round" stroke-linecap="round"/>`;
  };

  const dots = d.cur.map((v, i) =>
    `<circle class="hit" data-i="${i}" cx="${x(i)}" cy="${y(v)}" r="12" fill="transparent"/>`).join("");

  wrap.insertAdjacentHTML("beforeend", `
    <svg width="${W}" height="${H}" style="display:block">
      ${g}
      ${line(d.pre, "#c9d6f7", "#c9d6f7", .25)}
      ${line(d.cur, "#3b6ef6", "#3b6ef6", .12)}
      <g id="focusG" style="display:none">
        <line id="focusLine" y1="${PT}" y2="${PT+ih}" stroke="#d7dde8" stroke-dasharray="4 3"/>
        <circle id="focusDot" r="4.5" fill="#fff" stroke="#3b6ef6" stroke-width="2.5"/>
      </g>
      ${dots}
    </svg>`);

  const tip = $("#lineTip");
  const unit = trendKey === "revenue" ? "万" : "单";
  wrap.querySelectorAll(".hit").forEach(c => {
    c.addEventListener("mousemove", e => {
      const i = +c.dataset.i;
      const fg = wrap.querySelector("#focusG");
      fg.style.display = "";
      wrap.querySelector("#focusLine").setAttribute("x1", x(i));
      wrap.querySelector("#focusLine").setAttribute("x2", x(i));
      const dot = wrap.querySelector("#focusDot");
      dot.setAttribute("cx", x(i)); dot.setAttribute("cy", y(d.cur[i]));
      const diff = ((d.cur[i] - d.pre[i]) / d.pre[i] * 100).toFixed(1);
      tip.innerHTML = `<div class="tt-title">${labels[i]}</div>
        <div class="tt-row"><span class="sw" style="background:#3b6ef6"></span>本期 ${fmt(d.cur[i])}${unit}</div>
        <div class="tt-row"><span class="sw" style="background:#c9d6f7"></span>上期 ${fmt(d.pre[i])}${unit}</div>
        <div class="tt-row">环比 <b style="color:${diff >= 0 ? "#ff8a8d" : "#6fe0a0"}">${diff >= 0 ? "+" : ""}${diff}%</b></div>`;
      tip.style.opacity = 1;
      tip.style.left = Math.min(x(i) + 14, W - 150) + "px";
      tip.style.top = Math.max(y(d.cur[i]) - 70, 4) + "px";
    });
    c.addEventListener("mouseleave", () => {
      tip.style.opacity = 0;
      wrap.querySelector("#focusG").style.display = "none";
    });
  });
}

$("#trendSeg").addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON") return;
  $("#trendSeg").querySelectorAll("button").forEach(b => b.classList.remove("on"));
  e.target.classList.add("on");
  trendKey = e.target.dataset.k;
  renderLine();
});

/* ---------- 环形图 ---------- */
function renderDonut() {
  const data = DASHBOARD_DATA.channels;
  const total = data.reduce((s, c) => s + c.value, 0);
  const R = 62, C = 2 * Math.PI * R;
  let acc = 0;
  const segs = data.map(c => {
    const frac = c.value / total;
    const s = `<circle cx="90" cy="90" r="${R}" fill="none" stroke="${c.color}" stroke-width="22"
      stroke-dasharray="${(frac * C - 3).toFixed(1)} ${(C - frac * C + 3).toFixed(1)}"
      stroke-dashoffset="${(-acc * C + C / 4).toFixed(1)}" stroke-linecap="round"/>`;
    acc += frac;
    return s;
  }).join("");

  $("#donutWrap").innerHTML = `
    <svg width="180" height="180" viewBox="0 0 180 180">${segs}</svg>
    <div class="donut-center"><b>${fmt(total)}</b><span>总计(万元)</span></div>`;

  $("#donutLegend").innerHTML = data.map(c => `
    <div class="dl-row">
      <span class="sw" style="background:${c.color}"></span>
      <span class="name">${c.name}</span>
      <span class="val">${fmt(c.value)}万</span>
      <span class="pct">${(c.value / total * 100).toFixed(1)}%</span>
    </div>`).join("");
}

/* ---------- 区域排行 ---------- */
function renderRank() {
  const data = DASHBOARD_DATA.regions;
  const max = Math.max(...data.map(r => r.value));
  $("#rankList").innerHTML = data.map((r, i) => `
    <div class="rank-row">
      <div class="rank-top">
        <span class="rank-num">${i + 1}</span>${r.name}
        <span class="val">${fmt(r.value)}万</span>
        <span class="delta ${r.delta >= 0 ? "up" : "down"}">${r.delta >= 0 ? "▲" : "▼"}${Math.abs(r.delta)}%</span>
      </div>
      <div class="rank-bar-bg"><div class="rank-bar" style="width:${(r.value / max * 100).toFixed(1)}%"></div></div>
    </div>`).join("");
}

/* ---------- 动态表 ---------- */
function renderTable() {
  $("#tableBody").innerHTML = DASHBOARD_DATA.activities.map(a => `
    <tr>
      <td style="font-weight:500">${a.name}</td>
      <td><span class="tag ${a.tag}">${a.type}</span></td>
      <td>${a.value}</td>
      <td class="${a.momUp ? "num-up" : "num-down"}">${a.momUp ? "▲" : "▼"} ${a.mom}</td>
      <td><span class="tag ${a.status[1]}">${a.status[0]}</span></td>
    </tr>`).join("");
}

/* ---------- 示例数据随机扰动（演示交互用） ---------- */
function randomizeDemo() {
  DASHBOARD_DATA.kpi.forEach(k => {
    k.trend = +(k.trend + (Math.random() - .5) * 4).toFixed(1);
  });
  DASHBOARD_DATA.trend.revenue.cur = DASHBOARD_DATA.trend.revenue.cur.map(v => Math.round(v * (0.95 + Math.random() * .1)));
  DASHBOARD_DATA.trend.orders.cur = DASHBOARD_DATA.trend.orders.cur.map(v => Math.round(v * (0.95 + Math.random() * .1)));
  renderAll();
}

function renderAll() {
  renderKPI(); renderLine(); renderDonut(); renderRank(); renderTable();
}
renderAll();
window.addEventListener("resize", () => renderLine());
</script>
